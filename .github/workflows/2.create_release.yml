name: Create Nightly Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/1.build_plugin.yml
    secrets: inherit

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: plugin

      - name: Get current date
        id: date
        run: |
          echo "tag=nightly-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "name=Nightly $(date -u +'%Y-%m-%d %H:%M:%S') UTC" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.date.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: true
          files: "*.zip"
          fail_on_unmatched_files: true
